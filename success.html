<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful — Mnv</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        .success-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            font-family: var(--font-primary);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #fff;
        }

        .success-subtitle {
            font-family: var(--font-serif, Georgia, serif);
            font-size: 1.05rem;
            line-height: 1.7;
            color: #aaa;
            margin-bottom: 2rem;
        }

        #download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 100%);
            color: #fff;
            font-family: var(--font-primary);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
            margin-bottom: 1.2rem;
        }

        #download-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .timer-box {
            font-family: var(--font-primary);
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 1.5rem;
        }

        .timer-box span {
            color: #f0a500;
            font-weight: 600;
        }

        .error-box {
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.4);
            border-radius: 10px;
            padding: 1.2rem;
            font-family: var(--font-primary);
            font-size: 0.9rem;
            color: #e74c3c;
            margin-top: 1rem;
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            font-family: var(--font-primary);
            font-size: 0.85rem;
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #aaa;
        }
    </style>
</head>

<body>

    <header id="header">
        <div class="nav-wrapper">
            <h1 class="logo"><a href="index.html">Mnv</a></h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="books.html" class="active">Books</a></li>
                    <li><a href="otherwork.html">Other Work</a></li>
                    <li><a href="contact.html" class="nav-contact-btn">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="success-section">
        <div class="success-card" id="content-loading">

            <span class="success-icon">🎉</span>
            <h1 class="success-title">Payment Successful!</h1>
            <p class="success-subtitle">
                Thank you for buying <strong>Who Stayed</strong>.<br>
                Your secure download link is ready below.<br>
                It expires in <strong>15 minutes</strong> — download now.
            </p>

            <a id="download-btn" href="#" target="_blank" rel="noopener">
                ⬇️ &nbsp;Download Your eBook
            </a>

            <div class="timer-box">
                Link expires in: <span id="countdown">15:00</span>
            </div>

            <div id="error-area"></div>

            <a href="books.html" class="back-link">← Back to Books</a>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="back-to-top">
                <a href="#header">Back to Top</a>
            </div>
        </div>
    </footer>

    <script>
        const BACKEND = "http://localhost:5000";

        // ── Read token from URL ──────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        const downloadBtn = document.getElementById("download-btn");
        const errorArea = document.getElementById("error-area");

        if (!token) {
            errorArea.innerHTML = `
                <div class="error-box">
                    ⚠️ No download token found in URL.<br>
                    Please contact support with your payment ID.
                </div>`;
            downloadBtn.style.display = "none";
        } else {
            // Set the download link to the backend endpoint
            downloadBtn.href = `${BACKEND}/download/${token}`;
        }

        // ── 15-minute Countdown Timer ────────────────────────
        let totalSeconds = 15 * 60;
        const countdownEl = document.getElementById("countdown");

        const timer = setInterval(() => {
            totalSeconds--;
            if (totalSeconds <= 0) {
                clearInterval(timer);
                countdownEl.textContent = "EXPIRED";
                countdownEl.style.color = "#e74c3c";
                downloadBtn.style.opacity = "0.4";
                downloadBtn.style.pointerEvents = "none";
                downloadBtn.title = "This link has expired";
                errorArea.innerHTML = `
                    <div class="error-box">
                        ⏰ Your link has expired. Please contact us to get a new one.
                    </div>`;
                return;
            }
            const m = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
            const s = String(totalSeconds % 60).padStart(2, "0");
            countdownEl.textContent = `${m}:${s}`;
        }, 1000);
    </script>

</body>

</html>
