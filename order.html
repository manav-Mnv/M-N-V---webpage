<head>

    <style>
        .social-icon svg {
            display: block;
        }

        /* ── Payment Page Layout ── */
        .payment-page {
            min-height: calc(100vh - 80px);
            padding: 5rem 2rem 6rem;
        }

        .payment-inner {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5rem;
            align-items: start;
        }

        @media (max-width: 768px) {
            .payment-inner {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
        }

        /* ── Left: Product + QR ── */
        .payment-left {}

        .payment-label {
            font-family: var(--font-primary);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 0.6rem;
        }

        .payment-title {
            font-family: var(--font-primary);
            font-size: 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            line-height: 1.15;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .payment-subtitle {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: #666;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .price-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #111;
            color: #fff;
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.1em;
            padding: 0.65rem 1.4rem;
            margin-bottom: 2.5rem;
        }

        .divider-line {
            border: none;
            border-top: 1px solid #c9c0b4;
            margin: 2rem 0;
        }

        .qr-section {
            text-align: center;
            padding: 2rem 1.5rem;
            background: #fff;
            border: 1px solid #e0d9d0;
        }

        .qr-section-label {
            font-family: var(--font-primary);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 1.2rem;
        }

        .qr-image-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .qr-image-wrapper img {
            width: 200px;
            height: 200px;
            display: block;
        }

        .qr-upi-id {
            font-family: var(--font-primary);
            font-size: 0.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.4rem;
            letter-spacing: 0.05em;
        }

        .qr-amount-notice {
            font-family: var(--font-primary);
            font-size: 0.75rem;
            font-weight: 600;
            color: #c0392b;
            letter-spacing: 0.05em;
        }

        .steps-list {
            list-style: none;
            margin-top: 1.8rem;
        }

        .steps-list li {
            font-family: var(--font-primary);
            font-size: 0.8rem;
            color: #555;
            letter-spacing: 0.03em;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e8e2da;
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
        }

        .steps-list li:last-child {
            border-bottom: none;
        }

        .step-num {
            background: #111;
            color: #fff;
            font-family: var(--font-primary);
            font-size: 0.65rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* ── Right: Form ── */
        .payment-right {}

        .form-section-label {
            font-family: var(--font-primary);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 2rem;
        }

        .payment-form .field-wrap {
            margin-bottom: 1.6rem;
        }

        .payment-form label {
            display: block;
            font-family: var(--font-primary);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #444;
            margin-bottom: 0.45rem;
        }

        .payment-form input[type="text"],
        .payment-form input[type="email"] {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #bbb;
            background-color: #fff;
            font-family: var(--font-primary);
            font-size: 0.9rem;
            color: #333;
            outline: none;
            transition: border-color 0.3s ease;
            -webkit-appearance: none;
        }

        .payment-form input:focus {
            border-color: #006a50;
        }

        .txn-note {
            font-family: var(--font-primary);
            font-size: 0.68rem;
            color: #888;
            margin-top: 0.4rem;
            letter-spacing: 0.02em;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 1.1rem 2rem;
            background-color: #111;
            color: #fff;
            font-family: var(--font-primary);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 2rem;
        }

        .submit-btn:hover {
            background-color: #006a50;
        }

        .form-guarantee {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            margin-top: 1.5rem;
            padding: 1rem;
            border: 1px solid #e0d9d0;
            background: #f9f6f1;
        }

        .guarantee-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .form-guarantee p {
            font-family: var(--font-primary);
            font-size: 0.73rem;
            color: #555;
            line-height: 1.6;
        }

        .form-guarantee strong {
            color: #111;
            display: block;
            margin-bottom: 0.2rem;
            letter-spacing: 0.05em;
        }

        .success-note {
            font-family: var(--font-primary);
            font-size: 0.7rem;
            color: #888;
            text-align: center;
            margin-top: 1.2rem;
            letter-spacing: 0.03em;
        }

            text-align: center;
            margin-bottom: 4rem;

            font-family: var(--font-primary);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #888;
